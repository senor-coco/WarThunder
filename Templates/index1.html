<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con Árbol Sintáctico</title>
    <style>
        /* Estilos básicos para el cuerpo con imagen de fondo */
        body {
            font-family: Arial, sans-serif;
            background-image: url('../static/imagenes/hollownick.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
            margin: 0;
            padding: 0;
            color: white; /* Para mejorar visibilidad del texto sobre el fondo */
            display: flex;
            flex-direction: column; /* Cambiado para apilar elementos verticalmente */
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin-bottom: 30px; /* Espacio entre la calculadora y la tabla */
        }

        .calculator {
            display: inline-block;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.9); /* Fondo blanco semitransparente */
            margin-right: 50px; /* Espacio entre la calculadora y la tabla */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Sombra */
        }

        .display {
            font-size: 24px;
            margin-bottom: 10px;
            padding: 10px;
            width: 220px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff; /* Fondo blanco para mejor contraste */
        }

        /* Estilos para los botones de la calculadora */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .buttons button {
            font-size: 18px;
            padding: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .buttons button.number {
            background-color: #006994;
            color: white;
        }

        .buttons button.equals {
            background-color: #4CAF50;
            color: white;
        }

        .buttons button#tree {
            grid-column: span 4; /* Hace que el botón TREE ocupe toda la fila */
            background-color: #800080; /* Morado */
            color: white;
        }

        .buttons button:hover {
            opacity: 0.8; /* Efecto hover */
        }

        /* Estilos para la tabla de tokens */
        #tokens {
            margin-top: 0; /* Asegura que se alinee en la misma fila de la calculadora */
        }

        table {
            border-collapse: collapse; /* Colapsa bordes */
            background-color: rgba(255, 255, 255, 0.9); /* Fondo blanco semitransparente */
            color: black; /* Texto negro */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        th, td {
            border: 1px solid #ccc; /* Estilo de bordes */
            padding: 8px; /* Espaciado en celdas */
        }

        /* Estilos para el contenedor del árbol sintáctico */
        #treeContainer {
            margin-top: 30px; /* Espacio entre la calculadora y el árbol sintáctico */
        }

        svg {
            margin: 0 auto; /* Centra el SVG */
            border: 1px solid #ccc; /* Bordes del SVG */
            width: 800px;
            height: 600px;
        }

        circle {
            fill: lightblue; /* Color de relleno de los círculos */
            stroke: #333; /* Color del borde */
            stroke-width: 2; /* Grosor del borde */
        }

        text {
            font-family: Arial, sans-serif;
            font-size: 14px;
            fill: black; /* Color del texto */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <input type="text" id="display" class="display" disabled>
            <div class="buttons">
                <button onclick="clearDisplay()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button onclick="appendValue('/')">/</button>
                <button class="number" onclick="appendValue('7')">7</button>
                <button class="number" onclick="appendValue('8')">8</button>
                <button class="number" onclick="appendValue('9')">9</button>
                <button onclick="appendValue('*')">*</button>
                <button class="number" onclick="appendValue('4')">4</button>
                <button class="number" onclick="appendValue('5')">5</button>
                <button class="number" onclick="appendValue('6')">6</button>
                <button onclick="appendValue('-')">-</button>
                <button class="number" onclick="appendValue('1')">1</button>
                <button class="number" onclick="appendValue('2')">2</button>
                <button class="number" onclick="appendValue('3')">3</button>
                <button onclick="appendValue('+')">+</button>
                <button class="number" onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equals" onclick="calculate()">=</button>
                <button id="tree" onclick="generateTree()">TREE</button>
            </div>
        </div>

        <div id="tokens">
            <h3>Tokens:</h3>
            <table>
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody id="outputTokens"></tbody>
            </table>
        </div>
    </div>

    <div id="treeContainer">
        <h3>Árbol Sintáctico:</h3>
        <svg id="treeSvg" viewBox="0 0 800 600"></svg>
    </div>

    <script>
        function appendValue(value) {
            document.getElementById('display').value += value;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
            document.getElementById('outputTokens').innerHTML = '';
            document.getElementById('treeSvg').innerHTML = ''; // Limpiar árbol anterior
        }

       // Función para traducir tipos de tokens al español
function translateTokenType(type) {
    switch(type) {
        case 'NUMBER':
            return 'número';
        case 'PLUS':
            return 'suma';
        case 'MINUS':
            return 'resta';
        case 'MULTIPLY':
            return 'multiplicación';
        case 'DIVIDE':
            return 'división';
        case 'LPAREN':
            return 'paréntesis izquierdo';
        case 'RPAREN':
            return 'paréntesis derecho';
        case 'POINT':
            return 'punto';  // Añadir la traducción del punto decimal
        default:
            return type;
    }
}

        async function calculate() {
            const expression = document.getElementById('display').value;
            const response = await fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression })
            });
            const result = await response.json();
        
            if (result.status === 'success') {
                document.getElementById('display').value = result.result;
            } else if (result.status === 'error') {
                document.getElementById('display').value = result.result; // Mostrar el mensaje de error
            }
        
            let tokensHtml = '';
            result.tokens.forEach(token => {
                const translatedType = translateTokenType(token.type); // Traducir el tipo
                tokensHtml += `<tr><td>${token.value}</td><td>${translatedType}</td></tr>`;
            });
            document.getElementById('outputTokens').innerHTML = tokensHtml;
        }
        
        async function generateTree() {
            const expression = document.getElementById('display').value;
            const response = await fetch('/generate_tree', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression })
            });
            const result = await response.json();

            if (result.status === 'success') {
                const tree = result.tree;
                const svg = document.getElementById('treeSvg');
                svg.innerHTML = ''; // Limpiar el SVG anterior

                const radius = 20;
                const offsetX = 100;
                const offsetY = 60;

                const startX = svg.clientWidth / 2;
                const startY = 50;

                function drawNode(node, x, y, parentX = null, parentY = null) {
                    if (!node) return;

                    // Dibujar el nodo
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y);
                    circle.setAttribute('r', radius);
                    svg.appendChild(circle);

                    // Añadir texto al nodo
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', x);
                    text.setAttribute('y', y + 5);
                    text.setAttribute('text-anchor', 'middle');
                    text.textContent = node.value;
                    svg.appendChild(text);

                    // Dibujar la línea hacia el nodo padre
                    if (parentX !== null && parentY !== null) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', parentX);
                        line.setAttribute('y1', parentY);
                        line.setAttribute('x2', x);
                        line.setAttribute('y2', y);
                        line.setAttribute('stroke', 'black');
                        svg.appendChild(line);
                    }

                    // Dibujar nodos hijos
                    const childY = y + offsetY;
                    if (node.left) {
                        drawNode(node.left, x - offsetX, childY, x, y);
                    }
                    if (node.right) {
                        drawNode(node.right, x + offsetX, childY, x, y);
                    }
                }

                drawNode(tree, startX, startY);
            } else {
                console.error(result.result);
            }
        }
    </script>
</body>
</html>
